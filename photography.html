<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photography · M. G. Jones</title>
<meta name="description" content="Michael G. Jones, astronomer at Caltech/IPAC: faint dwarf galaxies, SEAMLESS, HCNS, HI-SAGA.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"><style>
/* Layout: full-bleed Milky Way hero, then 70rem features alternating image and text; one committed night-sky theme. */
:root{
  color-scheme:dark;
  --bg:#080d18; --panel:#101828; --ink:#e7ebf3; --muted:#9aa6bc; --line:#1f2a40; --accent:#9fcbff; --glow:#ffcf9a;
  --rg-a:#1b2840; --rg-b:#9fcbff; --rg-c:#121b2c; --rg-ink:#e7ebf3; --rg-muted:#9aa6bc; --rg-on-b:#080d18;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.03rem/1.7 var(--body)}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.gut{padding-inline:1.25rem}
.inner{max-width:70rem;margin:0 auto}
.bar{position:absolute;inset:0 0 auto 0;z-index:3;padding-top:env(safe-area-inset-top,0px)}
.bar .inner{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:.5rem 1.5rem;padding-block:1rem}
.bar .brand{font:700 1rem/1 var(--display);color:var(--ink);text-decoration:none;letter-spacing:.02em}
.bar ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.25rem 1.2rem;font:500 .74rem/1.6 var(--mono);text-transform:uppercase;letter-spacing:.1em}
.bar ul a{color:var(--ink);text-decoration:none;opacity:.85}
.bar ul a:hover{opacity:1;color:var(--accent)}
.hero{position:relative;background:#04070e url("assets/milkyway.jpg") center 45%/cover no-repeat;padding-block:7.5rem 3.5rem}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,13,24,.4) 0%,rgba(8,13,24,.05) 45%,var(--bg) 100%)}
.hero .inner{position:relative;z-index:1}
.kicker{font:500 .78rem/1.5 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--glow);margin:0 0 .75rem}
.hero h1{font:700 clamp(2.4rem,7vw,4.6rem)/1 var(--display);margin:0 0 1rem;letter-spacing:-.02em;text-wrap:balance}
.hero p.tag{font-size:clamp(1.05rem,2.2vw,1.3rem);max-width:38rem;margin:0 0 1.5rem;line-height:1.5}
.hero .links{display:flex;flex-wrap:wrap;gap:.6rem}
.btn{font:500 .8rem/1 var(--mono);padding:.65rem .95rem;border:1px solid rgba(231,235,243,.35);border-radius:3px;color:var(--ink);text-decoration:none;background:rgba(8,13,24,.45);backdrop-filter:blur(4px)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.addr{font:400 .8rem/1.6 var(--mono);color:var(--muted);margin-top:.9rem;user-select:all}
section{padding-block:4rem}
.sh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.5rem 2rem;margin-bottom:2rem;border-bottom:1px solid var(--line);padding-bottom:.75rem}
.sh h2{font:700 clamp(1.7rem,3.5vw,2.4rem)/1.1 var(--display);margin:0;letter-spacing:-.01em}
.sh p{margin:0;color:var(--muted);font:400 .8rem/1.5 var(--mono);text-transform:uppercase;letter-spacing:.1em}
.about{display:grid;grid-template-columns:13rem minmax(0,1fr);gap:2.5rem;align-items:start}
.about img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px}
.about > div{max-width:42rem}
.feature{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3rem;align-items:center;padding-block:3rem;border-top:1px solid var(--line)}
.feature:first-of-type{border-top:0;padding-top:0}
.feature.flip > .media{order:2}
.feature > div{min-width:0}
.feature .code{font:500 .76rem/1.5 var(--mono);color:var(--glow);text-transform:uppercase;letter-spacing:.12em;margin:0 0 .4rem}
.feature h3{font:700 clamp(1.5rem,3vw,2.1rem)/1.1 var(--display);margin:0 0 .35rem;text-wrap:balance}
.feature .full{font-style:italic;color:var(--muted);margin:0 0 1rem}
.feature .lede{font-size:1.15rem;line-height:1.5;margin:0 0 1rem}
.media img{width:100%;display:block;border-radius:4px;box-shadow:0 0 0 1px var(--line),0 30px 60px -30px rgba(159,203,255,.35)}
.media figcaption{font-size:.85rem;color:var(--muted);margin-top:.6rem;line-height:1.5}
.media figure{margin:0}
details{border-top:1px solid var(--line);margin-top:1rem}
summary{cursor:pointer;font:500 .8rem/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent);padding-block:.9rem;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ "} details[open] summary::before{content:"− "}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.statgrid div{background:var(--panel);padding:1.1rem 1.2rem}
.statgrid div:last-child{grid-column:1/-1}
.statgrid b{display:block;font:700 2rem/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.statgrid span{font:400 .75rem/1.4 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.textpanel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1.5rem}
.textpanel dl{margin:0;display:grid;gap:1rem}
.textpanel dt{font:400 .74rem/1.4 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.textpanel dd{margin:.15rem 0 0;font:500 1.05rem/1.4 var(--display)}
.regime{width:100%;height:auto;display:block;font-family:var(--mono)}
.regime-wrap{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1.25rem 1.25rem .75rem;margin-top:2rem}
.regime-wrap p{margin:.5rem 0 0;color:var(--muted);font-size:.88rem}
.tbl-wrap{overflow-x:auto}
table.disc{border-collapse:collapse;width:100%;font-size:.92rem;margin-top:.5rem}
table.disc th,table.disc td{text-align:left;padding:.5rem .9rem .5rem 0;border-bottom:1px solid var(--line);vertical-align:top}
table.disc thead th{font:500 .7rem/1.4 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
table.disc tbody th{font-family:var(--display);font-weight:700}
table.disc td:nth-child(2){font-family:var(--mono);font-size:.85rem;white-space:nowrap}
.refs{font-size:.9rem;color:var(--muted)}
.past{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1.25rem}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.pcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;opacity:.9}
.pcard .noimg{aspect-ratio:16/9;display:grid;place-items:center;font:700 1.4rem/1 var(--display);color:var(--line);background:linear-gradient(135deg,var(--panel),var(--bg))}
.pcard > div{padding:1rem 1.1rem 1.1rem}
.pcard h3{font:700 1.1rem/1.25 var(--display);margin:0 0 .35rem}
.pcard p{margin:0 0 .5rem;font-size:.93rem;color:var(--muted);line-height:1.55}
.pubcols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:3rem}
.pubcols > div{min-width:0}
.pubcols h3{font:500 .78rem/1.4 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--glow);margin:0 0 1rem}
ul.pubs{list-style:none;padding:0;margin:0}
li.pub{display:flex;flex-direction:column;padding-block:.6rem;border-bottom:1px solid var(--line)}
.pub-title{color:var(--ink);text-decoration:none;line-height:1.4}
.pub-title:hover{color:var(--accent)}
.pub-meta{font:400 .78rem/1.6 var(--mono);color:var(--muted)}
.pub-meta b{color:var(--ink);font-weight:500}
.talks{list-style:none;padding:0;margin:0}
.talks li{padding-block:.6rem;border-bottom:1px solid var(--line)}
.talks .v{display:block;font:400 .78rem/1.6 var(--mono);color:var(--muted)}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1.5rem}
.out h3{font:700 1.1rem/1.2 var(--display);margin:0 0 .35rem}
.out p{margin:0;color:var(--muted);font-size:.95rem}
footer{border-top:1px solid var(--line);padding-block:2rem 3rem;font:400 .76rem/1.6 var(--mono);color:var(--muted)}
.gallery{columns:3 16rem;column-gap:1rem}
.ph{break-inside:avoid;margin:0 0 1rem;position:relative}
.ph img{width:100%;display:block;border-radius:3px}
.ph figcaption{font:400 .74rem/1.4 var(--mono);color:var(--muted);padding:.45rem 0 0}
.pano{overflow-x:auto;margin-bottom:.5rem}
.pano img{height:18rem;width:auto;max-width:none;display:block}
@media (max-width:820px){.feature,.pubcols{grid-template-columns:1fr;gap:1.5rem}.feature.flip > .media{order:0}.about{grid-template-columns:1fr}.about img{max-width:11rem}}
@media (max-width:520px){.hero{padding-block:9rem 2.5rem}.bar ul{gap:.15rem .9rem}}
</style>
</head>
